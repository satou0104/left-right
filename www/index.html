<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>左右落下ゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- タイトル画面 -->
    <div id="title-screen" class="screen">
        <div id="title-container">
            <h1 class="game-title">左右落下</h1>
            <p class="game-subtitle">瞬間判断力ゲーム</p>
            <button id="title-start-btn" class="title-start-btn">スタート</button>
            <p class="version-text">v1.2.0</p>
        </div>
    </div>

    <!-- メイン画面 -->
    <div id="main-menu" class="screen hidden">
        <div id="main-container">
            <div id="credit-display">クレジット: <span id="credit-value">10</span></div>
            <h1 id="game-title">左右落下</h1>
            <div id="menu-buttons">
                <button id="start-menu-btn" class="menu-btn">ノーマル</button>
                <button id="start-hard-btn" class="menu-btn hard-btn">ハード</button>
                <button id="start-super-hard-btn" class="menu-btn super-hard-btn">スーパーハード</button>
                <button id="highscore-btn" class="menu-btn">ランキング</button>
                <button id="instructions-btn" class="menu-btn">操作説明</button>
                <button id="settings-btn" class="menu-btn">設定</button>
            </div>
        </div>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="screen hidden">
        <div id="game-container">
            <div id="score-container">
                <div id="score">スコア: <span id="score-value">0</span></div>
                <div id="highscore">ハイスコア: <span id="highscore-value">0</span></div>
            </div>
            <div id="game-area">
            </div>
            <div id="game-controls">
                <button id="start-btn">ゲーム開始</button>
                <button id="back-to-menu-btn" class="back-btn">メニューに戻る</button>
            </div>
        </div>
    </div>

    <!-- 操作説明画面 -->
    <div id="instructions-screen" class="screen hidden">
        <div id="instructions-container">
            <h2>操作説明</h2>
            <div class="instruction-content">
                <h3>基本操作</h3>
                <p>画面を左右にタッチして文字を消します</p>
                
                <h3>文字の種類</h3>
                <div class="rule-item">
                    <strong>黒文字：</strong>文字の意味で判断<br>
                    「左」→ 左タッチ、「右」→ 右タッチ
                </div>
                <div class="rule-item">
                    <strong style="color: #ff4757;">赤文字：</strong>文字の位置で判断<br>
                    左側 → 左タッチ、右側 → 右タッチ
                </div>
                
                <h3>ゲームルール</h3>
                <p>・文字が画面下に到達前に正しく操作する</p>
                <p>・間違った操作をするとゲームオーバー</p>
                <p>・20点ごとにスピードアップ</p>
            </div>
            <button id="back-from-instructions-btn" class="back-btn">戻る</button>
        </div>
    </div>

    <!-- 設定画面 -->
    <div id="settings-screen" class="screen hidden">
        <div id="settings-container">
            <h2>設定</h2>
            <div class="settings-content">
                <div class="setting-item">
                    <span class="setting-label">効果音</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="sound-toggle" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="setting-item name-setting">
                    <span class="setting-label">ランキング表示名</span>
                    <div class="name-input-row">
                        <input type="text" id="ranking-name-input" class="ranking-name-input" maxlength="10" placeholder="aaa">
                        <button id="save-name-btn" class="save-name-btn">保存</button>
                    </div>
                </div>
            </div>
            <button id="back-from-settings-btn" class="back-btn">戻る</button>
        </div>
    </div>

    <!-- ハイスコア画面 -->
    <div id="highscore-screen" class="screen hidden">
        <div id="highscore-container">
            <h2 id="ranking-title">ランキング</h2>
            <div class="mode-tabs">
                <button id="normal-tab" class="tab-btn active">ノーマル</button>
                <button id="hard-tab" class="tab-btn">ハード</button>
                <button id="superhard-tab" class="tab-btn super-hard-tab">スーパーハード</button>
            </div>
            <div class="ranking-tabs">
                <button id="local-ranking-tab" class="ranking-tab-btn active">ローカル</button>
                <button id="global-ranking-tab" class="ranking-tab-btn">グローバル</button>
            </div>
            <p class="ranking-note">※ランキングはデイリーのみになります。</p>
            <div id="highscore-list" class="highscore-content">
                <!-- ハイスコアリストがここに表示される -->
            </div>
            <button id="back-from-highscore-btn" class="back-btn">戻る</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, push, set, query, orderByChild, limitToLast, get } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCcBkGAOcXp2ufeLcOhqa1mmd8bf4N6hpo",
            authDomain: "sayuurakka.firebaseapp.com",
            databaseURL: "https://sayuurakka-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "sayuurakka",
            storageBucket: "sayuurakka.firebasestorage.app",
            messagingSenderId: "853164393919",
            appId: "1:853164393919:web:91fd323980da40322a0d0a"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // グローバルに公開
        window.firebaseDB = database;
        window.firebaseRef = ref;
        window.firebasePush = push;
        window.firebaseSet = set;
        window.firebaseQuery = query;
        window.firebaseOrderByChild = orderByChild;
        window.firebaseLimitToLast = limitToLast;
        window.firebaseGet = get;
    </script>
    <script src="game.js"></script>
</body>
</html>
